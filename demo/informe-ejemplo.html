    const pct = !!W.pct && multi && !line;
    const stacked = pct || !!(W.stacked && (R.s || R.multi) && !line);
    let tots = null;
    if (pct) tots = R.keys.map((k, i) => R.series.reduce((a, S) => a + (S.values[i] || 0), 0));
    // Total por barra (solo barras apiladas con m\u00e1s de una parte)
    const showTotals = !!W.totals && stacked && multi && !line;
    const barTotals = showTotals ? R.keys.map((k, i) => { let t = 0, any = false; R.series.forEach(S => { if (sOn(S.key) && mOn(S.key) && S.values[i] != null) { t += S.values[i]; any = true; } }); return any ? t : null; }) : null;
    const datasets = R.series.map(S => {
      const c0 = colorFor(S.key, S.colorIdx), faded = !(mOn(S.key) && sOn(S.key)), c = faded ? alpha(c0, 0.22) : c0;
      const data = pct ? S.values.map((v, i) => v == null ? null : (tots[i] ? v / tots[i] * 100 : 0)) : S.values;
      if (line) return { label: S.label, data: S.values, borderColor: c, backgroundColor: selK ? R.keys.map(k => selK.keys.has(k) ? c : alpha(c0, faded ? 0.15 : 0.35)) : c, borderWidth: 2,
        pointRadius: selK ? R.keys.map(k => selK.keys.has(k) ? 6 : (R.keys.length > 36 ? 0 : 3)) : (R.keys.length > 36 ? 0 : 3), pointHoverRadius: 6, pointBorderColor: surf, pointBorderWidth: 1.5, tension: 0, spanGaps: true };

        borderColor: surf, borderWidth: stacked ? { top: 1, bottom: 0, left: 0, right: 0 } : 0,
        borderRadius: stacked ? 0 : 4, borderSkipped: 'start', maxBarThickness: 56, categoryPercentage: 0.78, barPercentage: 0.92

    });

    const catAxis = {
      stacked, grid: { display: false }, border: { color: axis },

        color: selK ? (ctx => selK.keys.has(R.keys[ctx.index]) ? tok('--ink-1') : ink3) : ink3,
        font: selK ? (ctx => ({ size: 11, weight: selK.keys.has(R.keys[ctx.index]) ? '700' : '400' })) : { size: 11 }, maxRotation: line || horizontal ? 0 : 40, autoSkip: line || horizontal || R.keys.length > 24, autoSkipPadding: 8,
        callback: function (v) { const l = String(this.getLabelForValue(v)); return l.length > 22 ? l.slice(0, 21) + '\u2026' : l; }

    if (pct) { valAxis.max = 100; valAxis.min = 0; }

    const tip = pct ? tooltipOpts(W, { callbacks: { label: ctx => ' ' + ctx.dataset.label + ': ' + nf(1).format(ctx.raw || 0) + '%  (' + fmtVal(ctx.dataset.rawValues[ctx.dataIndex], W) + ')' } }) : tooltipOpts(W);
    cfg = {
      type: line ? 'line' : 'bar',

        interaction: { mode: 'index', intersect: false, axis: horizontal ? 'y' : 'x' }, onClick, onHover,
        layout: { padding: { top: (showLabels && !horizontal && !stacked) || (showTotals && !horizontal) ? 18 : 4, right: (showLabels && horizontal && !stacked) || (showTotals && horizontal) ? 56 : 8 } },
        scales: horizontal ? { x: valAxis, y: catAxis } : { x: catAxis, y: valAxis },
        plugins: {

            generateLabels: chart => Chart.defaults.plugins.legend.labels.generateLabels(chart).map(l => {
              const ds = chart.data.datasets[l.datasetIndex]; if (ds && ds.gfColor) { l.fillStyle = ds.gfColor; l.strokeStyle = ds.gfColor; } l.fontColor = ink2; l.hidden = false; return l;
            })

            : R.s ? (e, item) => toggleSeriesSel(W, R, R.series[item.datasetIndex].key, e.native && (e.native.ctrlKey || e.native.metaKey || e.native.shiftKey)) : undefined,

  canvas.__gfFmtTot = v => fmtCompact(v, W);
  const ch = new Chart(canvas, cfg);
  ch.$gfTitle = W.title || autoTitle(W);

}

/* ---------- selecci\u00f3n de medida (clic en una porci\u00f3n/serie de \u00abVarias columnas\u00bb) ----------
   Una medida no es un valor de una columna, as\u00ed que no se filtran filas: se \u00abenfoca\u00bb la medida.
   - Los objetos con la misma medida muestran solo esa medida.
   - Los objetos cuyo valor por fila es el total de las medidas (p. ej. CANTIDAD = sin flag + con flag)
     pasan a mostrar solo la parte elegida. Se comprueba con los datos, no por el nombre. */
const sig = cols => cols.slice().sort().join('\u0001');
function toggleMeasure(W, idx) {
  const m = W.measures[idx]; if (!m || !(m.cols || []).length) return;
  const cur = GF.rt.msel;
  if (cur && cur.wid === W.id && cur.idx === idx) GF.rt.msel = null;
  else GF.rt.msel = { wid: W.id, idx, label: m.label || m.cols.join(' + '), cols: m.cols.slice(), parts: W.measures.map(x => (x.cols || []).slice()).filter(c => c.length) };
  GF.refresh();
}
GF.toggleMeasure = toggleMeasure;
const totalCache = {};
function isTotalOf(cols, parts) {
  const key = sig(cols) + '|' + parts.map(sig).join('|') + '|' + GF.data.rows.length;
  if (key in totalCache) return totalCache[key];
  const ci = cols.map(n => colOf(n)), pci = parts.map(p => p.map(n => colOf(n)));
  if (ci.some(c => !c) || pci.some(p => p.some(c => !c))) return (totalCache[key] = false);
  // No es \u00abtotal\u00bb si la columna ya es una de las partes.
  const partSet = new Set([].concat(...parts)); if (cols.every(c => partSet.has(c))) return (totalCache[key] = false);
  let n = 0, ok = 0;
  for (const r of GF.data.rows) {
    let t = 0, any = false; for (const c of ci) { const v = r[c.ci]; if (typeof v === 'number') { t += v; any = true; } }
    if (!any) continue;
    let s2 = 0; for (const p of pci) for (const c of p) { const v = r[c.ci]; if (typeof v === 'number') s2 += v; }
    n++; if (Math.abs(t - s2) <= Math.max(1e-6, Math.abs(t) * 1e-9)) ok++;
  }
  return (totalCache[key] = n > 0 && ok / n >= 0.98);
}

  const ms = GF.rt.msel;
  if (!ms || ms.wid === W.id || !GF.data) return W;
  if (isMulti(W)) {
    const i = W.measures.findIndex(m => sig(m.cols || []) === sig(ms.cols) || (m.label && norm(m.label) === norm(ms.label)));
    if (i < 0) return W;
    return Object.assign({}, W, { measures: [Object.assign({}, W.measures[i], { ci: i })], $focus: ms.label, pct: false });
  }
  if (W.type === 'text' || (W.type === 'table' && W.mode === 'detalle')) return W;
  const cols = kpiMulti(W) ? W.kcols : (W.measure && W.measure !== '__rows' && (colOf(W.measure) || {}).type === 'number' ? [W.measure] : null);
  const agg = aggOf(W);

  if (W.type === 'kpi') { if (!['sum', 'avg', 'min', 'max'].includes(agg)) return W; return Object.assign({}, W, { vmode: 'multi', kcols: ms.cols.slice(), $focus: ms.label }); }

  const src = GF.cfg.widgets.find(w => w.id === ms.wid), sc = src && src.colors && src.colors['m' + ms.idx];

}

function toggleSel(W, R, k, multi) {
  const s = GF.rt.sel;
  if (s && s.wid === W.id) {
    if (multi) { if (s.keys.has(k)) s.keys.delete(k); else s.keys.add(k); }
    else if (s.keys.size === 1 && s.keys.has(k)) s.keys = new Set();
    else s.keys = new Set([k]);
    if (!s.keys.size && !(s.skeys && s.skeys.size)) GF.rt.sel = null;

    GF.rt.sel = { wid: W.id, col: W.dim, grain: R.dg, type: R.d.type, keys: new Set([k]) };
  }
  GF.refresh();

/* Clic en la leyenda de un gr\u00e1fico con serie (p. ej. 0 / 1): filtra todo el tablero por ese valor. */
function toggleSeriesSel(W, R, sk, multi) {

  let s = GF.rt.sel;
  if (!s || s.wid !== W.id) s = GF.rt.sel = { wid: W.id, col: W.dim, grain: R.dg, type: R.d ? R.d.type : 'text', keys: new Set() };
  if (!s.skeys || s.scol !== W.series) { s.scol = W.series; s.sgrain = R.sg; s.stype = R.s.type; s.skeys = new Set(); }
  if (multi) { if (s.skeys.has(sk)) s.skeys.delete(sk); else s.skeys.add(sk); }
  else if (s.skeys.size === 1 && s.skeys.has(sk)) s.skeys = new Set();
  else s.skeys = new Set([sk]);
  if (!s.keys.size && !s.skeys.size) GF.rt.sel = null;

/* ---------------- KPI, tabla, texto ---------------- */
function renderKpi(W, body, rows) {
  const m = measureFn(W), agg = aggOf(W), a = newAcc();
  for (const r of rows) addAcc(a, m(r), agg);
  const v = accVal(a, agg);
  const note = W.$focus ? 'Solo: ' + W.$focus : (W.note || '');
  const total = GF.data.rows.length, shown = rows.length;
  const sub = shown < total && (!W.measure || W.measure === '__rows') ? nf(0).format(shown) + ' de ' + nf(0).format(total) + ' registros' : '';
  let txt = fmtVal(v, W), full = txt;
  body.innerHTML = '<div class="gf-kpi"><div class="gf-kpi-v" title="' + esc(full) + '">' + esc(txt) + '</div>' + (note ? '<div class="gf-kpi-l">' + esc(note) + '</div>' : '') + (sub ? '<div class="gf-kpi-s">' + esc(sub) + '</div>' : '') + '</div>';
  // Achica la letra hasta que el n\u00famero entre completo; si igual no entra, lo abrevia.
  const ve = body.querySelector('.gf-kpi-v');
  if (W.colors && /^#[0-9a-f]{6}$/i.test(W.colors.__kpi || '')) ve.style.color = W.colors.__kpi;
  let fs = 32;
  while (ve.scrollWidth > ve.clientWidth + 1 && fs > 18) { fs -= 2; ve.style.fontSize = fs + 'px'; }
  if (ve.scrollWidth > ve.clientWidth + 1 && typeof v === 'number' && (W.dec == null || W.dec === '')) { ve.style.fontSize = ''; ve.textContent = fmtCompact(v, W); }
}

function summaryTableHTML(W, R, interactive) {

  const dimLab = R.d ? esc(colLabel(R.d.name)) : (R.measures ? 'Medida' : '');
  const multi = !!R.s || !!R.multi;

  R.series.forEach(S => { h += '<th class="n">' + esc(S.label) + '</th>'; });
  if (multi) h += '<th class="n">Total</th>';
  h += '</tr></thead><tbody>';
  R.keys.forEach((k, i) => {
    const cls = (interactive && k !== OTHERK ? 'gf-click' : '') + (sel && sel.keys.has(k) ? ' gf-on' : '');
    h += '<tr data-k="' + esc(k) + '" class="' + cls + '"><td>' + esc(R.labels[i]) + '</td>';
    R.series.forEach(S => { h += '<td class="n">' + esc(fmtVal(S.values[i], W)) + '</td>'; });
    if (multi) h += '<td class="n">' + esc(fmtVal(accVal(R.map.get(k).acc, R.agg), W)) + '</td>';
    h += '</tr>';

      h += '<td class="n">' + esc(fmtVal(accVal(t, R.agg), W)) + '</td>';
    });

function renderTable(W, body, rows) {
  if (W.mode !== 'detalle') {
    if (!W.dim && !isMulti(W)) throw cfgErr('Eleg\u00ed una columna para agrupar.');
    const R = computeSeries(W, rows);
    GF.rt.lastR = GF.rt.lastR || {}; GF.rt.lastR[W.id] = R;
    const box = el('div', 'gf-tbox', summaryTableHTML(W, R, true));
    body.appendChild(box);
    box.querySelectorAll('tr.gf-click').forEach(tr => {
      tr.onclick = e => toggleSel(W, R, tr.getAttribute('data-k'), e.ctrlKey || e.metaKey || e.shiftKey);
    });
    return;
  }
  const D = GF.data;
  let cols = (W.cols && W.cols.length ? W.cols.map(colOf).filter(Boolean) : D.columns.map((c, i) => ({ ci: i, type: c.type, name: c.name })));
  const ts = GF.rt.tsort[W.id];
  let list = rows;
  if (ts) {
    const c = colOf(ts.col);
    if (c) {
      const dir = ts.dir;
      list = rows.slice().sort((a, b) => {
        const x = a[c.ci], y = b[c.ci];
        if (x == null) return 1; if (y == null) return -1;
        if (c.type === 'text') return dir * String(x).localeCompare(String(y), 'es', { numeric: true });
        return dir * (x - y);

    }
  }
  const LIM = 500;
  let h = '<table class="gf-table gf-detail"><thead><tr>';
  cols.forEach(c => {
    const on = ts && ts.col === c.name;
    h += '<th data-c="' + esc(c.name) + '" class="gf-sort' + (c.type !== 'text' ? ' n' : '') + '">' + esc(colLabel(c.name)) + (on ? (ts.dir > 0 ? ' \u25b2' : ' \u25bc') : '') + '</th>';
  });
  h += '</tr></thead><tbody>';
  const n = Math.min(list.length, LIM);
  for (let i = 0; i < n; i++) {
    const r = list[i]; h += '<tr>';
    cols.forEach(c => { h += '<td' + (c.type !== 'text' ? ' class="n"' : '') + '>' + esc(fmtCell(r[c.ci], c.type, isMonthly(c), c.name)) + '</td>'; });
    h += '</tr>';
  }
  h += '</tbody></table>';

  body.appendChild(box);
  body.appendChild(el('div', 'gf-tnote', list.length > LIM ? 'Mostrando ' + nf(0).format(LIM) + ' de ' + nf(0).format(list.length) + ' registros \u00b7 descarg\u00e1 el CSV para verlos todos' : nf(0).format(list.length) + ' registros'));
  box.querySelectorAll('th.gf-sort').forEach(th => {
    th.onclick = () => {
      const c = th.getAttribute('data-c'), cur = GF.rt.tsort[W.id];
      GF.rt.tsort[W.id] = cur && cur.col === c ? (cur.dir > 0 ? { col: c, dir: -1 } : null) : { col: c, dir: 1 };
      GF.refresh();
    };
  });
}

function mdLite(t) {
  const lines = esc(t || '').split(/\n/);
  let out = '', para = [];
  const flush = () => { if (para.length) { out += '<p>' + para.join('<br>') + '</p>'; para = []; } };
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g, '$1<em>$2</em>');
  for (const l of lines) {
    if (/^#{1,3}\s/.test(l)) { flush(); out += '<h3>' + inline(l.replace(/^#{1,3}\s/, '')) + '</h3>'; }
    else if (/^[-\u2022]\s/.test(l)) { flush(); out += '<li>' + inline(l.slice(2)) + '</li>'; }
    else if (!l.trim()) flush();
    else para.push(inline(l));
  }
  flush();
  return out.replace(/(<li>.*?<\/li>)+/g, m => '<ul>' + m + '</ul>');
}

/* ---------------- tarjeta de objeto ---------------- */
const TYPE_NAME = { kpi: 'Indicador', bar: 'Barras', barh: 'Barras horizontales', line: 'L\u00edneas', pie: 'Dona', table: 'Tabla', text: 'Texto' };
GF.TYPE_NAME = TYPE_NAME;

/* ---------------- grilla libre ----------------
   12 columnas de ancho y filas de 10 px. Cada objeto tiene posici\u00f3n (gx, gy), ancho (w) y alto (gh, en filas).
   Puede haber espacios vac\u00edos entre objetos, como en Power BI. */
const GU = 10, GGAP = 14;
GF.GU = GU; GF.GGAP = GGAP;
const H_PRESET = { xs: 132, s: 250, m: 340, l: 460, xl: 620 };
GF.H_PRESET = H_PRESET;

GF.overlap = overlap;
/* Acomoda en filas, como antes (para tableros armados con versiones anteriores o autom\u00e1ticos). */
GF.packFlow = function (ws) {
  let x = 0, y = 0, rowH = 0;
  ws.forEach(W => {
    const w = Math.max(1, Math.min(12, +W.w || 6)), h = W.gh || legacyRows(W);
    if (x + w > 12) { y += rowH; x = 0; rowH = 0; }
    W.w = w; W.gx = x; W.gy = y; W.gh = h; x += w; rowH = Math.max(rowH, h);
  });
};
GF.layoutBottom = ws => ws.reduce((m, W) => W.gy != null ? Math.max(m, W.gy + (W.gh || 0)) : m, 0);
GF.ensureLayout = function (cfg) {
  const ws = (cfg || GF.cfg).widgets || [];
  if (!ws.length) return;
  if (!ws.some(W => W.gy != null)) { GF.packFlow(ws); return; }
  ws.forEach(W => {
    if (W.gy == null) { W.w = Math.max(1, Math.min(12, +W.w || 6)); W.gh = W.gh || legacyRows(W); W.gx = 0; W.gy = GF.layoutBottom(ws); }
    if (W.gx + W.w > 12) W.gx = Math.max(0, 12 - W.w);
  });
};
/* Resuelve superposiciones: el objeto \u00abfijo\u00bb queda donde est\u00e1 y los que choca bajan lo necesario.
   Los dem\u00e1s no se mueven hacia arriba, as\u00ed se respetan los espacios vac\u00edos. */
GF.resolveLayout = function (items, fixedId) {
  const L = items.map(o => Object.assign({}, o));
  const fixed = L.find(o => o.id === fixedId);
  const order = (fixed ? [fixed] : []).concat(L.filter(o => o !== fixed).sort((a, b) => a.y - b.y || a.x - b.x));
  const placed = [];
  for (const it of order) {
    if (it !== fixed) {
      let moved = true, guard = 0;
      while (moved && guard++ < 500) { moved = false; for (const p of placed) if (overlap(it, p)) { it.y = p.y + p.h; moved = true; } }
    }
    placed.push(it);
  }
  return L;
};
/* Sube todo lo posible, sin cambiar el orden (bot\u00f3n \u00abQuitar espacios vac\u00edos\u00bb). */
GF.compactLayout = function (items) {
  const L = items.map(o => Object.assign({}, o)).sort((a, b) => a.y - b.y || a.x - b.x), placed = [];
  for (const it of L) {
    while (it.y > 0) { const t = Object.assign({}, it, { y: it.y - 1 }); if (placed.some(p => overlap(t, p))) break; it.y--; }
    placed.push(it);
  }
  return L;
};
GF.layoutItems = ws => ws.map(W => ({ id: W.id, x: W.gx, y: W.gy, w: W.w, h: W.gh }));
GF.applyLayout = function (L) { L.forEach(o => { const W = GF.cfg.widgets.find(w => w.id === o.id); if (W) { W.gx = o.x; W.gy = o.y; W.w = o.w; W.gh = o.h; } }); };
GF.placeCard = function (card, x, y, w, h) {
  card.style.gridColumn = (x + 1) + ' / span ' + w;
  card.style.gridRow = (y + 1) + ' / span ' + h;
  card.style.setProperty('--hpx', GF.rowsToPx(h) + 'px');
  card.classList.toggle('gf-narrow', w <= 4);
};

function buildCard(W) {

function autoTitle(W) {

  if (isMulti(W)) return W.measures.map((m, i) => m.label || 'Medida ' + (i + 1)).join(' vs. ') + (W.dim && W.type !== 'pie' ? ' por ' + colLabel(W.dim) : '');
  return measureLabel(W) + (W.dim ? ' por ' + colLabel(W.dim) : '');
}
GF.autoTitle = autoTitle;

function cardMenu(W, anchor) {
  const box = el('div', 'gf-menu');
  const items = [];
  items.push(['Pantalla completa', () => GF.openFocus(W.id)]);
  if (W.type !== 'table') items.push(['Ver datos como tabla', () => showData(W)]);
  if (W.type !== 'table') items.push(['Copiar imagen', () => copyPNG(W)]);
  if (W.type !== 'table') items.push(['Descargar imagen (PNG)', () => downloadPNG(W)]);

  items.forEach(([t, fn]) => { const b = el('button', 'gf-menu-i', esc(t)); b.onclick = () => { GF.closePopover(); fn(); }; box.appendChild(b); });
  GF.popover(anchor, box, { align: 'right' });
}

function currentRowsFor(W) {
  const base = GF.baseRows(); const sp = selPred();
  return GF.rt.sel && GF.rt.sel.wid !== W.id && sp ? base.filter(sp) : base;
}
function showData(W) {
  const R = computeSeries(W, currentRowsFor(W));
  GF.modal(W.title || autoTitle(W), '<div class="gf-tbox gf-tbox-modal">' + summaryTableHTML(W, R, false) + '</div>', [{ label: 'Cerrar' }]);
}
function slug(s) { return norm(s || 'informe').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'informe'; }
GF.slug = slug;
function download(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
GF.download = download;
/* Imagen del gr\u00e1fico con su t\u00edtulo, lista para pegar en un correo o una presentaci\u00f3n. */
function chartImage(W) {
  const ch = GF.rt.charts[W.id + '__fs'] || GF.rt.charts[W.id];
  if (!ch) return null;
  const src = ch.canvas, sc = src.width / ch.width;
  const pad = Math.round(20 * sc), th = Math.round(34 * sc);
  const cv = document.createElement('canvas');
  cv.width = src.width + pad * 2; cv.height = src.height + pad * 2 + th;
  const x = cv.getContext('2d');
  x.fillStyle = tok('--surface') || '#fff'; x.fillRect(0, 0, cv.width, cv.height);
  x.fillStyle = tok('--ink-1') || '#000';
  x.font = '600 ' + Math.round(15 * sc) + 'px ' + Chart.defaults.font.family;
  x.textBaseline = 'top';
  x.fillText(ch.$gfTitle || W.title || autoTitle(W), pad, pad);
  x.drawImage(src, pad, pad + th);
  return cv;
}
function downloadPNG(W) {
  const cv = chartImage(W);
  if (!cv) { GF.toast('No hay gr\u00e1fico para descargar'); return; }
  cv.toBlob(b => download(slug(W.title || autoTitle(W)) + '.png', b), 'image/png');
}
function copyPNG(W) {
  const cv = chartImage(W);
  if (!cv) { GF.toast('No hay gr\u00e1fico para copiar'); return; }
  if (!navigator.clipboard || !window.ClipboardItem) { GF.toast('Este navegador no permite copiar im\u00e1genes. Us\u00e1 \u00abDescargar imagen\u00bb.', 'warn'); return; }
  const blobP = new Promise(res => cv.toBlob(res, 'image/png'));
  navigator.clipboard.write([new ClipboardItem({ 'image/png': blobP })])
    .then(() => GF.toast('Imagen copiada. Pegala con Ctrl + V en un correo o una presentaci\u00f3n.'))
    .catch(() => GF.toast('No se pudo copiar la imagen. Us\u00e1 \u00abDescargar imagen\u00bb.', 'warn'));
}
GF.copyPNG = copyPNG;
function csvCell(v, type) {
  if (v == null) return '';
  let s;
  if (typeof v === 'number' && type !== 'date') s = String(v).replace('.', ',');
  else if (type === 'date') s = fmtDate(v);
  else s = String(v);
  return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCSV(W) {
  const rows = currentRowsFor(W);
  let lines = [];
  if (W.type === 'table' && W.mode === 'detalle') {
    const D = GF.data;
    const cols = W.cols && W.cols.length ? W.cols.map(colOf).filter(Boolean) : D.columns.map((c, i) => ({ ci: i, type: c.type, name: c.name }));
    lines.push(cols.map(c => csvCell(colLabel(c.name))).join(';'));
    rows.forEach(r => lines.push(cols.map(c => csvCell(r[c.ci], c.type)).join(';')));
  } else if (W.type === 'kpi') {
    const m = measureFn(W), agg = aggOf(W), a = newAcc(); rows.forEach(r => addAcc(a, m(r), agg));
    lines.push(csvCell(measureLabel(W))); lines.push(csvCell(accVal(a, agg)));
  } else {
    const R = computeSeries(W, rows);
    lines.push([R.d ? colLabel(R.d.name) : ''].concat(R.series.map(S => S.label)).map(x => csvCell(x)).join(';'));
    R.keys.forEach((k, i) => lines.push([csvCell(R.labels[i])].concat(R.series.map(S => csvCell(S.values[i]))).join(';')));
  }
  download(slug(W.title || autoTitle(W)) + '.csv', new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
}

/* ---------------- popover, modal, aviso ---------------- */
let popState = null;
GF.popover = function (anchor, content, opts) {
  GF.closePopover();
  opts = opts || {};
  const box = el('div', 'gf-pop'); box.appendChild(content);
  document.body.appendChild(box);
  const r = anchor.getBoundingClientRect(), bw = box.offsetWidth, bh = box.offsetHeight;
  let left = opts.align === 'right' ? r.right - bw : r.left;
  left = Math.max(8, Math.min(left, window.innerWidth - bw - 8));
  let top = r.bottom + 6;
  if (top + bh > window.innerHeight - 8 && r.top - bh - 6 > 8) top = r.top - bh - 6;
  box.style.left = left + window.scrollX + 'px'; box.style.top = top + window.scrollY + 'px';
  const onDoc = e => { if (!box.contains(e.target) && !anchor.contains(e.target)) GF.closePopover(); };
  const onKey = e => { if (e.key === 'Escape') GF.closePopover(); };
  setTimeout(() => { document.addEventListener('mousedown', onDoc); document.addEventListener('keydown', onKey); }, 0);
  popState = { box, off: () => { document.removeEventListener('mousedown', onDoc); document.removeEventListener('keydown', onKey); } };
  return box;
};
GF.closePopover = function () { if (popState) { popState.off(); popState.box.remove(); popState = null; } };

GF.modal = function (title, content, buttons, opts) {
  opts = opts || {};
  const ov = el('div', 'gf-overlay');
  const m = el('div', 'gf-modal' + (opts.wide ? ' gf-modal-wide' : ''));
  m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.appendChild(el('div', 'gf-modal-h', '<h2>' + esc(title) + '</h2>'));
  const b = el('div', 'gf-modal-b');
  if (typeof content === 'string') b.innerHTML = content; else b.appendChild(content);
  m.appendChild(b);
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  if (buttons && buttons.length) {
    const f = el('div', 'gf-modal-f');
    buttons.forEach(bt => {
      const x = el('button', 'gf-btn' + (bt.primary ? ' gf-primary' : ''), esc(bt.label));
      x.onclick = () => { if (bt.onClick && bt.onClick() === false) return; close(); };
      f.appendChild(x);
    });
    m.appendChild(f);
  }
  ov.appendChild(m);
  ov.addEventListener('mousedown', e => { if (e.target === ov && !opts.sticky) close(); });
  document.body.appendChild(ov);
  return { close, body: b, el: m };
};
GF.toast = function (msg, kind) {
  const t = el('div', 'gf-toast' + (kind ? ' gf-toast-' + kind : ''), esc(msg));
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('on'));
  setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 300); }, 3200);
};

/* ---------------- barra de filtros ---------------- */
function listSummary(f, list) {
  const v = GF.rt.fvals[f.id];
  if (!v || !v.set) return 'Todos';
  if (!v.set.size) return 'Ninguno';
  if (v.set.size === 1) { const k = [...v.set][0]; const it = list.find(x => x.key === k); return it ? it.label : k; }
  return v.set.size + ' seleccionados';
}
function renderFilters(bar) {
  bar.innerHTML = '';
  const D = GF.data;
  const items = el('div', 'gf-fitems');
  for (const f of GF.cfg.filters) {
    const c = colOf(f.col);
    const chip = el('div', 'gf-fchip' + (isFilterActive(f) ? ' gf-active' : ''));
    if (!c) { chip.classList.add('gf-bad'); chip.appendChild(el('span', 'gf-flab', 'Falta la columna \u00ab' + esc(f.col) + '\u00bb')); }
    else if (f.kind === 'list') {
      const list = GF.distinctList(c);
      const btn = el('button', 'gf-fbtn', '<span class="gf-flab">' + esc(f.label || colLabel(f.col)) + '</span><span class="gf-fval">' + esc(listSummary(f, list)) + '</span><svg class="gf-caret" viewBox="0 0 12 12" width="12" height="12"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>');
      btn.onclick = () => openListPopover(f, c, btn);
      chip.appendChild(btn);
    } else {
      const v = GF.rt.fvals[f.id] || {};
      const P = D.profile[c.ci];
      const isD = c.type === 'date';
      const toStr = x => x == null ? '' : (isD ? isoDate(x) : String(x));
      const fromStr = s => s === '' ? null : (isD ? parseDateStr(s) : parseNum(s));
      chip.appendChild(el('span', 'gf-flab', esc(f.label || colLabel(f.col))));
      const mk = (which, ph) => {
        const inp = el('input', 'gf-finp');
        inp.type = isD ? 'date' : 'number'; if (!isD) inp.step = 'any';
        inp.value = toStr(v[which]); inp.placeholder = ph;
        if (P.min != null) { inp.min = toStr(P.min); inp.max = toStr(P.max); }
        inp.setAttribute('aria-label', (f.label || colLabel(f.col)) + (which === 'from' ? ' desde' : ' hasta'));
        inp.onchange = () => { const cur = GF.rt.fvals[f.id] || (GF.rt.fvals[f.id] = {}); cur[which] = fromStr(inp.value); GF.refresh(); };
        return inp;
      };
      chip.appendChild(mk('from', P.min != null ? (isD ? '' : fmtCell(P.min, 'number')) : 'desde'));
      chip.appendChild(el('span', 'gf-fsep', '\u2013'));
      chip.appendChild(mk('to', P.max != null ? (isD ? '' : fmtCell(P.max, 'number')) : 'hasta'));
    }
    if (GF.mode === 'edit' && GF.hooks.removeFilter) {
      const x = el('button', 'gf-icon gf-fx', '<svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.5"/></svg>');
      x.title = 'Quitar filtro'; x.setAttribute('aria-label', 'Quitar filtro');
      x.onclick = () => GF.hooks.removeFilter(f.id);
      chip.appendChild(x);
    }
    items.appendChild(chip);
  }
  const s = GF.rt.sel;
  const selParts = [];
  if (s) {
    const srcW = GF.cfg.widgets.find(w => w.id === s.wid), names = (srcW && srcW.names) || {};
    const part = (col, keys, type, grain, useNames) => { const labs = [...keys].map(k => (useNames && names[k]) || labelOf(k, type, grain)); return colLabel(col) + ': ' + (labs.length > 3 ? labs.slice(0, 3).join(', ') + ' y ' + (labs.length - 3) + ' m\u00e1s' : labs.join(', ')); };
    if (s.keys.size && colOf(s.col)) selParts.push(part(s.col, s.keys, s.type, s.grain, srcW && srcW.type === 'pie'));
    if (s.skeys && s.skeys.size && colOf(s.scol)) selParts.push(part(s.scol, s.skeys, s.stype, s.sgrain, true));
  }
  if (selParts.length) {
    const chip = el('div', 'gf-fchip gf-active gf-selchip');
    chip.appendChild(el('span', 'gf-flab', 'Selecci\u00f3n'));
    chip.appendChild(el('span', 'gf-fval', esc(selParts.join(' \u00b7 '))));
    const x = el('button', 'gf-icon gf-fx', '<svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.5"/></svg>');
    x.title = 'Quitar selecci\u00f3n'; x.onclick = () => { GF.rt.sel = null; GF.refresh(); };
    chip.appendChild(x);
    items.appendChild(chip);
  }
  const ms = GF.rt.msel;
  if (ms) {
    const chip = el('div', 'gf-fchip gf-active gf-selchip');
    chip.appendChild(el('span', 'gf-flab', 'Medida'));
    chip.appendChild(el('span', 'gf-fval', esc(ms.label)));
    const x = el('button', 'gf-icon gf-fx', '<svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.5"/></svg>');
    x.title = 'Quitar'; x.onclick = () => { GF.rt.msel = null; GF.refresh(); };
    chip.appendChild(x); items.appendChild(chip);
  }
  if (GF.hooks.filterBarExtra) GF.hooks.filterBarExtra(items);
  bar.appendChild(items);
  const right = el('div', 'gf-fright');
  const anyActive = GF.cfg.filters.some(isFilterActive) || !!GF.rt.sel || !!GF.rt.msel;
  if (D) {
    const n = GF.rt.baseCount != null ? GF.rt.baseCount : D.rows.length;
    right.appendChild(el('span', 'gf-count', anyActive ? nf(0).format(n) + ' de ' + nf(0).format(D.rows.length) + ' registros' : nf(0).format(D.rows.length) + ' registros'));
  }
  if (anyActive) {
    const b = el('button', 'gf-link', 'Limpiar filtros'); b.onclick = GF.clearFilters; right.appendChild(b);
  }
  bar.appendChild(right);
  bar.style.display = (GF.cfg.filters.length || GF.hooks.filterBarExtra || D) ? '' : 'none';
}

function openListPopover(f, c, anchor) {
  const list = GF.distinctList(c);
  const box = el('div', 'gf-lpop');
  box.innerHTML = '<input class="gf-lsearch" type="search" placeholder="Buscar\u2026" aria-label="Buscar valores"><div class="gf-lacts"><button class="gf-link" data-a="all">Todos</button><button class="gf-link" data-a="none">Ninguno</button><button class="gf-link" data-a="only">Solo los visibles</button></div><div class="gf-litems"></div>';
  const itemsEl = box.querySelector('.gf-litems'), q = box.querySelector('.gf-lsearch');
  const cur = () => (GF.rt.fvals[f.id] && GF.rt.fvals[f.id].set) || null;
  const setSet = s => {
    if (s && s.size === list.length) s = null;
    GF.rt.fvals[f.id] = { set: s };
    if (GF.rt.sel && (GF.rt.sel.col === f.col || GF.rt.sel.scol === f.col)) GF.rt.sel = null;
    GF.refresh();
  };
  let visible = list;
  const draw = () => {
    const nq = norm(q.value.trim());
    visible = nq ? list.filter(x => norm(x.label).includes(nq)) : list;
    const s = cur();
    let h = '';
    visible.slice(0, 400).forEach((x, i) => {
      h += '<label class="gf-litem"><input type="checkbox" data-i="' + i + '"' + (!s || s.has(x.key) ? ' checked' : '') + '><span class="gf-ll">' + esc(x.label) + '</span><span class="gf-lc">' + nf(0).format(x.count) + '</span></label>';
    });
    if (visible.length > 400) h += '<div class="gf-lmore">Mostrando 400 de ' + nf(0).format(visible.length) + '. Us\u00e1 la b\u00fasqueda.</div>';
    if (!visible.length) h = '<div class="gf-lmore">Sin coincidencias</div>';
    itemsEl.innerHTML = h;
  };
  itemsEl.addEventListener('change', e => {
    const i = +e.target.getAttribute('data-i'); const k = visible[i].key;
    const s = cur() ? new Set(cur()) : new Set(list.map(x => x.key));
    if (e.target.checked) s.add(k); else s.delete(k);
    setSet(s);
  });
  box.querySelector('.gf-lacts').addEventListener('click', e => {
    const a = e.target.getAttribute('data-a'); if (!a) return;
    if (a === 'all') setSet(null);
    else if (a === 'none') setSet(new Set());
    else setSet(new Set(visible.map(x => x.key)));
    draw();
  });
  q.addEventListener('input', draw);
  draw();
  GF.popover(anchor, box);
  q.focus();
}
